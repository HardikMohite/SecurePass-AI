# render.yaml — SecurePass AI backend
#
# Docker-runtime web service. Build context is the project root; the
# Dockerfile lives at backend/Dockerfile.
# Env vars below are declared with `generateValue: true` for automatic
# secure key generation or `sync: false` for secrets.

services:
  - type: web
    name: securepass-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Render will automatically generate unique cryptographically secure secrets
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      # Required: Supabase connection string (port 6543 or 5432)
      # e.g. postgresql://postgres.[REF]:[PASS]@aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false

      - key: FLASK_ENV
        value: production

      # Optional: set to your Vercel URL (e.g. https://your-app.vercel.app)
      # if calling Render backend directly without Vercel's rewrite proxy
      - key: CORS_ORIGINS
        sync: false

      # Optional: Redis for distributed rate limits & token blocklist.
      # If left unset, the backend automatically and safely uses memory:// without errors.
      - key: REDIS_URL
        sync: false
      - key: RATELIMIT_STORAGE_URL
        sync: false

      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: logs/securepass.log
      - key: WEB_CONCURRENCY
        value: "2"

      # Optional: Groq API key for AI-generated password policies
      - key: GROQ_API_KEY
        sync: false
