[pytest]
# Run from inside backend/: `pytest` (or `python -m pytest`).
minversion = 7.0
testpaths = tests
# Makes backend/ itself importable (app.py, models.py, config.py, ai_engine.py,
# etc. all live directly in this folder now) without needing an editable
# install or a conftest.py-side sys.path hack in every test module.
pythonpath = .
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
    # Test-only HMAC secrets in config.TestingConfig are intentionally
    # short/human-readable — not a real security concern for the test DB.
    ignore:.*HMAC key.*:UserWarning
