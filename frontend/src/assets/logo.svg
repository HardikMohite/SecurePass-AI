<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-label="SecurePass AI Emblem">
  <defs>
    <!-- Outer Shield Gradient (Left Facet) -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="45%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Outer Shield Gradient (Right Facet) -->
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- High-Contrast Razor-Sharp Outer Cyber Border -->
    <linearGradient id="borderOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Metallic Shield Bevel Highlight Gradient -->
    <linearGradient id="bevelHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Inner Armor Plate Gradient -->
    <linearGradient id="innerPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Inner Neon Border Gradient -->
    <linearGradient id="borderInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Padlock Chrome Shackle Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Vault Hexagon Body Gradient -->
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Core Cryptographic Iris Radial Gradient -->
    <radialGradient id="coreIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </radialGradient>
  </defs>

  <!-- 1. Outer Dark Backplate for Maximum Border Contrast -->
  <path d="M 256,30 L 400,68 L 436,148 L 424,286 L 256,482 L 88,286 L 76,148 L 112,68 Z"
        fill="#050811"
        stroke="#00f0ff"
        stroke-width="2"
        stroke-opacity="0.4"
        stroke-linejoin="round"/>

  <!-- 2. Main Armor Shield Body - Left Facet -->
  <path d="M 256,34 L 116,72 L 80,150 L 92,284 L 256,478 Z"
        fill="url(#facetLeft)"/>

  <!-- 3. Main Armor Shield Body - Right Facet -->
  <path d="M 256,34 L 396,72 L 432,150 L 420,284 L 256,478 Z"
        fill="url(#facetRight)"/>

  <!-- 4. Crisp Metallic Crown Bevel Highlights -->
  <path d="M 256,34 L 116,72 L 138,90 L 256,52 Z" fill="#3b82f6" opacity="0.6"/>
  <path d="M 256,34 L 396,72 L 374,90 L 256,52 Z" fill="url(#bevelHighlight)" opacity="0.75"/>

  <!-- 5. PRIMARY ULTRA-SHARP OUTER BORDER (8px Stroke, 100% Crisp) -->
  <path d="M 256,34 L 396,72 L 432,150 L 420,284 L 256,478 L 92,284 L 80,150 L 116,72 Z"
        fill="none"
        stroke="url(#borderOuter)"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- 6. Secondary Inset Sharp Contour (2px Stroke) -->
  <path d="M 256,46 L 386,82 L 418,154 L 408,276 L 256,460 L 104,276 L 94,154 L 126,82 Z"
        fill="none"
        stroke="#00f0ff"
        stroke-width="2"
        stroke-opacity="0.7"
        stroke-linejoin="round"/>

  <!-- 7. Center Dividing Spine Highlight -->
  <line x1="256" y1="36" x2="256" y2="476"
        stroke="#00f0ff"
        stroke-width="2.5"
        opacity="0.9"/>

  <!-- 8. Inner Recessed Cryptographic Armor Plate -->
  <path d="M 256,70 L 376,102 L 404,166 L 394,270 L 256,440 L 118,270 L 108,166 L 136,102 Z"
        fill="url(#innerPlate)"
        stroke="url(#borderInner)"
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- 9. High-Tech Corner Brackets -->
  <path d="M 150,112 L 136,102 L 108,166 L 118,180" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 362,112 L 376,102 L 404,166 L 394,180" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 238,422 L 256,440 L 274,422" fill="none" stroke="#00f0ff" stroke-width="3"/>

  <!-- 10. Neural AI Circuit Tracks & Connection Nodes -->
  <!-- Left Circuit Branches -->
  <path d="M 184,270 L 146,242 L 146,204" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="146" cy="204" r="5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>

  <path d="M 184,320 L 146,342 L 146,376" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="146" cy="376" r="5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Right Circuit Branches -->
  <path d="M 328,270 L 366,242 L 366,204" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="366" cy="204" r="5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>

  <path d="M 328,320 L 366,342 L 366,376" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="366" cy="376" r="5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Bottom Circuit Conduit -->
  <path d="M 256,376 L 256,416" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="416" r="4.5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>

  <!-- 11. Padlock Heavy Shackle -->
  <path d="M 214,232 L 214,166 C 214,136 298,136 298,166 L 298,232"
        fill="none"
        stroke="url(#shackleGrad)"
        stroke-width="16"
        stroke-linecap="round"/>
  <!-- Shackle Inner Chrome Reflection -->
  <path d="M 224,230 L 224,168 C 224,146 288,146 288,168 L 288,230"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.9"/>

  <!-- 12. Central Hexagonal Cyber Vault Body -->
  <path d="M 256,218 L 328,256 L 328,336 L 256,376 L 184,336 L 184,256 Z"
        fill="url(#vaultGrad)"
        stroke="#00f0ff"
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- Vault Inner Inset Hexagon -->
  <path d="M 256,230 L 316,262 L 316,330 L 256,364 L 196,330 L 196,262 Z"
        fill="none"
        stroke="#2563eb"
        stroke-width="1.5"
        opacity="0.8"/>

  <!-- 13. Central Cryptographic Keyhole & Iris -->
  <circle cx="256" cy="292" r="16" fill="url(#coreIris)" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 252,296 L 260,296 L 263,322 L 249,322 Z" fill="#00f0ff"/>
  <circle cx="256" cy="292" r="5.5" fill="#0b1329"/>
  <circle cx="256" cy="292" r="2.5" fill="#ffffff"/>

  <!-- 14. Diagonal Glass Sheen Highlight -->
  <polygon points="116,72 256,34 256,240 88,200" fill="#ffffff" opacity="0.08"/>
</svg>
