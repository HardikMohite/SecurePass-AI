<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SecurePass AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-panel-left">
            <div class="auth-content">
                <a href="/" class="auth-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-shield" style="color: var(--accent);">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        <path d="M12 2v20c5-1 8-5 8-10V5l-8-3z" fill="var(--accent)" stroke="none" />
                    </svg>
                    <span>Secure<span class="logo-pass">Pass</span> AI</span>
                </a>
                <h1 class="auth-title">Protect your <br><span style="color: var(--accent);">Identity</span> with AI.</h1>
                <ul class="auth-features">
                    <li><i data-lucide="check-circle"></i> Batch Password Security Auditing</li>
                    <li><i data-lucide="check-circle"></i> AI-Powered Risk Forecasting</li>
                    <li><i data-lucide="check-circle"></i> Regulatory Compliance Scanning</li>
                    <li><i data-lucide="check-circle"></i> Enterprise Data Loss Prevention</li>
                </ul>
            </div>
        </div>
        
        <div class="auth-panel-right">
            <div class="auth-card">
                <h2>Welcome back</h2>
                <p>Sign in to your account to continue.</p>

                <form id="loginForm" novalidate>
                    <div id="errMsg" style="display: none; padding: 0.75rem; background: rgba(255, 95, 87, 0.1); color: #ff5f57; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1.5rem;"></div>
                    <div id="successMsg" style="display: none; padding: 0.75rem; background: rgba(40, 200, 64, 0.1); color: #28c840; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1.5rem;"></div>

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" class="auth-input" placeholder="name@company.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" id="pwEye" class="password-eye" aria-label="Toggle password visibility">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- FIX: added remember-me + kept forgot-password link, both aligned properly -->
                    <div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; color: var(--text-muted);">
                            <input type="checkbox" id="remember" style="accent-color: var(--accent); width: 15px; height: 15px;">
                            Remember me
                        </label>
                        <a href="/forgot-password" style="color: var(--accent); font-size: 0.85rem; text-decoration: none; font-weight: 500;">Forgot password?</a>
                    </div>

                    <button type="submit" id="loginSubmit" class="btn btn-primary">
                        <span id="loginBtnText">Sign In</span>
                        <i data-lucide="chevron-right"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="/register">Create one</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FIX: auth.js MUST load before login.js — it defines window.Auth which login.js depends on -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
