<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SecurePass AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recovery.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="recovery-wrapper">
        <!-- Left Panel -->
        <div class="panel-left">
            <div class="dot-grid"></div>
            <div class="panel-left-content">
                <div class="brand-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 2v20c5-1 8-5 8-10V5l-8-3z" fill="currentColor" stroke="none"/>
                    </svg>
                </div>
                <h1 class="brand-name">SecurePass <span>AI</span></h1>
                <p class="tagline">Enterprise Password Intelligence</p>
                
                <h2 class="hero-title">Recover your <span>Access</span></h2>
                
                <ul class="feature-list">
                    <li class="feature-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>Automated breach correlation</span>
                    </li>
                    <li class="feature-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>Entropy-based reset logic</span>
                    </li>
                    <li class="feature-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>Multi-factor link validation</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="panel-right">
            <div class="form-container">
                <h2 class="page-title">Forgot Password</h2>
                <p class="page-subtitle">Enter your registered email and we'll send you a reset link</p>

                <div class="form-group">
                    <label class="field-label">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon-left">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </span>
                        <input type="email" class="recovery-input" placeholder="name@company.com" required>
                    </div>
                </div>

                <button class="btn-recovery" id="sendBtn">Send Reset Link</button>

                <div class="back-link">
                    Remember your password? <a href="/login">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', function() {
            // Simulated navigation to check email page
            window.location.href = '/check-email';
        });
    </script>
</body>
</html>
