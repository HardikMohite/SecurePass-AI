<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SecurePass AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recovery.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="recovery-wrapper">
        <!-- Left Panel -->
        <div class="panel-left">
            <div class="dot-grid"></div>
            <div class="panel-left-content">
                <div class="brand-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 2v20c5-1 8-5 8-10V5l-8-3z" fill="currentColor" stroke="none"/>
                    </svg>
                </div>
                <h1 class="brand-name">SecurePass <span>AI</span></h1>
                <p class="tagline">Enterprise Password Intelligence</p>
                
                <h2 class="hero-title">Recover your <span>Access</span></h2>
                
                <ul class="feature-list">
                    <li class="feature-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>Automated breach correlation</span>
                    </li>
                    <li class="feature-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>Entropy-based reset logic</span>
                    </li>
                    <li class="feature-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <span>Multi-factor link validation</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="panel-right">
            <div class="form-container">
                <h2 class="page-title">Forgot Password</h2>
                <p class="page-subtitle">Enter your email and we'll send you a link to reset your password.</p>

                <div class="recovery-form">
                    <input type="email" class="recovery-input" placeholder="you@company.com">
                    <button id="sendBtn" class="btn btn-primary recovery-btn">Send Reset Link</button>
                </div>

                <a href="/login" class="back-link">
                    <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async function () {
            const emailInput = document.querySelector('.recovery-input');
            const email = emailInput ? emailInput.value.trim() : '';

            if (!email) {
                emailInput && (emailInput.style.borderColor = '#ff5f57');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailInput && (emailInput.style.borderColor = '#ff5f57');
                alert('Please enter a valid email address.');
                return;
            }
            emailInput && (emailInput.style.borderColor = '');

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.textContent = 'Sending…';

            try {
                /* TODO: Replace with real API call when endpoint is ready:
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'Request failed'); }
                */

                // Mask email for display: first char + stars + domain
                const masked = email.replace(/^(.)(.*)(@.*)$/, function (_, a, b, c) {
                    return a + '*'.repeat(Math.min(b.length, 5)) + c;
                });

                window.location.href = '/check-email?email=' + encodeURIComponent(masked);

            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
                alert(err.message || 'Failed to send reset email. Please try again.');
            }
        });
    </script>

</body>
</html>
