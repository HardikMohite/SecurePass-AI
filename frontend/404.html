<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass AI | Routing to Dashboard</title>
    <meta http-equiv="refresh" content="0; url=/">
    <link rel="icon" type="image/svg+xml" href="/securepass_logo.svg">
    <link rel="alternate icon" type="image/png" href="/securepass_logo.png">
    <link rel="stylesheet" href="./src/css/error.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
    <script>
        // Seamlessly route user to Dashboard without showing an error screen
        window.location.replace('/');
    </script>
</head>
<body>
    <div class="cyber-grid-bg"></div>

    <div class="error-container">
        <a href="/" class="brand-lockup">
            <img src="/securepass_logo.svg" alt="SecurePass AI Logo" class="brand-logo-img">
            <span class="brand-text">SecurePass</span>
            <span class="brand-badge">AI</span>
        </a>

        <div class="error-card">
            <div class="redirect-pulse">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                </svg>
            </div>

            <div class="status-pill blue">
                <span class="status-dot"></span>
                <span>SENTINEL CORE ROUTING</span>
            </div>

            <h1 class="error-title">Routing to Dashboard...</h1>
            <p class="error-desc">
                Directing you securely to the active Sentinel Security Audit &amp; Hygiene console.
            </p>

            <div class="action-group">
                <a href="/" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Open Dashboard</span>
                </a>
            </div>
        </div>

        <p class="footer-note">SecurePass AI Enterprise Security Infrastructure</p>
    </div>
</body>
</html>
